[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "batuque"
version = "0.1.0"
description = "Batuque - Gerenciador de música e sincronizador de dispositivos open-source para Linux inspirado no MusicBee"
readme = "README.md"
authors = [
    { name = "Murillo Bom" }
]
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio"
]
dependencies = [
    "mutagen>=1.47.0",
    "pillow>=10.0.0",
    "PyGObject>=3.44.0"
]

[project.scripts]
batuque = "batuque.__main__:run_entrypoint"
batuque-gui = "batuque.ui.app:run_app"
batuque-cli = "batuque.cli:main"
soundbee = "batuque.__main__:run_entrypoint"
soundbee-gui = "batuque.ui.app:run_app"
soundbee-cli = "batuque.cli:main"

[tool.setuptools]
packages = ["batuque", "soundbee"]
